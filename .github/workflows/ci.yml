# dlaunch CI — coverage (cargo-tarpaulin) + complexity (cargo-crap) gates.
#
# One job, one coverage run, two gates fed by it: tarpaulin runs the whole
# suite under instrumentation (it exits non-zero on any test failure, so the
# coverage run IS the test run) and writes lcov.info, which cargo-crap then
# scores. cargo-crap never runs tests itself — it parses source with syn and
# reads the LCOV, scoring CRAP(m) = CC²·(1−cov)³ + CC. Without the coverage
# feed every function scores cov=0 and CRAP collapses to CC³+CC, so the
# complexity gate would measure nothing; that is why the two live in one job.
#
# Public repo, so this follows the public-repo convention: ubuntu-latest.
# The gate is intended to become a required check once it is green — see the
# PR that adds this file for the branch-protection plan.
#
# Tool pinning: both tools install from per-arch release tarballs at exact
# versions and each version is asserted — two runs cannot disagree because one
# host happened to have a newer cargo-crap. Versions are crates.io
# max_stable_version at authoring: tarpaulin 0.37.5, cargo-crap 0.6.1.
#
# Engine choice is MEASURED, not preferred. `--engine Ptrace` is blocked in
# the fleet's confined runner containers ("ASLR disable failed: EPERM",
# dirmacs/skywalkers run 38064108686), so CI uses the Llvm engine: it is
# source-based (-Cinstrument-coverage + llvm-profdata + llvm-cov), needs no
# ptrace/personality changes, and the llvm-tools-preview component below
# provides profdata/llvm-cov. Local measurement on the build host ran the
# same suite under ptrace; llvm-vs-ptrace deltas on comparable suites sit
# inside the floor margin.
#
# No rust-toolchain.toml in this repo, so the toolchain step installs stable
# explicitly via dtolnay/rust-toolchain@stable. The e2e suite resolves the
# mock_claude helper from CARGO_MANIFEST_DIR/target, so the job must NOT
# override CARGO_TARGET_DIR — it uses cargo's default.
#
# IMPORTANT — the repo's dev-dependencies (assert_cmd, predicates, tempfile)
# are missing from Cargo.toml/Cargo.lock at first authoring, so `cargo test`
# and this gate are RED on main until the manifest fix lands (tracked issue;
# the adding PR is closed-held with the branch retained for a zero-change
# reopen). The measured numbers encoded below are from a local run with the
# dev-dependencies present: 23/23 tests green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, and no job needs more: nothing here pushes, tags, publishes, or
# reads a secret. Least privilege so a compromised step still cannot write to
# the repository.
permissions:
  contents: read

# A superseded run's green tick is worthless: when a branch is pushed again,
# cancel the in-flight run for the same ref rather than let it race. Keyed on
# the ref, so PR runs for different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-crap:
    name: coverage + CRAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repo-specific constants, measured on the first run — see the PR that
      # added this job for the numbers and the ratchet.
      #
      # Measured under tarpaulin 0.37.5 (ptrace on the build host, Llvm in
      # CI) with 23/23 tests green: line coverage 3.90% (8/205 lines). The
      # suite invokes the dlaunch binary out-of-process (assert_cmd), so only
      # the in-process unit tests in src/session.rs count toward coverage —
      # the 3.90% is a floor of convenience, and the ratchet reviews it once
      # the dev-dependency fix lands.
      COVERAGE_FLOOR: "1"
      # Measured worst maintained-surface CRAP: 42.0, tied at three sites —
      # cmd_clean.rs::run (line 7, CC 6), cmd_list.rs::run (line 6, CC 6),
      # tmux.rs::install (line 29, CC 6), each 0% covered. The CLI entry
      # points in src/main.rs (main: CC 15/CRAP 240; launch: CC 13/CRAP 182)
      # are excluded below — same posture as git-sync's main.rs exclusion:
      # a 0%-by-design CLI surface would otherwise set a meaningless ceiling.
      CRAP_THRESHOLD: "47"
    steps:
      - name: checkout
        # Pinned to an immutable commit SHA (resolved from the v5.1.0 tag),
        # never the moving `@v5` tag — same commit the proven skywalkers job
        # uses.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: install toolchain (llvm-tools-preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview backs the llvm engine and any
          # llvm-profdata/llvm-cov invocation.
          components: llvm-tools-preview

      - name: Cargo.lock is committed, not generated
        # --locked below exits non-zero if the lockfile is missing or would
        # have to change, so the dependency set can only move when a human
        # commits a reviewed lockfile. That mechanism needs the file to exist.
        run: git ls-files --error-unmatch Cargo.lock

      - name: install pinned coverage + CRAP tools
        run: |
          set -euo pipefail
          TARPAULIN_VERSION=0.37.5
          CRAP_VERSION=0.6.1
          case "$(uname -m)" in
            aarch64) arch=aarch64 ;;
            x86_64)  arch=x86_64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          # $GITHUB_PATH only affects LATER steps, not this one -- the version
          # assertions below run here, so the dir must be on PATH inside this
          # same script.
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSLf "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSLf "https://github.com/minikin/cargo-crap/releases/download/v${CRAP_VERSION}/cargo-crap-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo-tarpaulin --version | grep -qx "tarpaulin ${TARPAULIN_VERSION}"
          cargo-crap --version | grep -qx "cargo-crap ${CRAP_VERSION}"

      - name: coverage gate (tarpaulin, llvm engine)
        # Single-package repo (no workspace members), so no --workspace.
        # No dev-deps are pinned in the repo yet, so this is red until the
        # manifest ships assert_cmd/predicates/tempfile — see the issue this
        # PR references. Uses cargo's default target dir: the e2e suite
        # resolves its mock_claude helper from CARGO_MANIFEST_DIR/target.
        run: >-
          cargo tarpaulin --engine Llvm --locked
          --out Lcov --fail-under "$COVERAGE_FLOOR" --timeout 300

      - name: CRAP gate (fed by this run's coverage, entry point excluded)
        # `--exclude '**/main.rs'`: `main`/`launch` are the clap CLI surface —
        # argument parsing and wiring with 0% test coverage by design —
        # scoring CRAP 240 (CC 15) and 182 (CC 13). Gate those numbers and
        # the ceiling measures nothing; silence them and the ceiling is
        # meaningful, same documented posture as git-sync's exclusion.
        # cargo-crap logs one expected warning on stderr that the excluded
        # LCOV file matched no analyzed source. Everything else is scored.
        run: >-
          cargo crap --lcov lcov.info --exclude '**/main.rs'
          --threshold "$CRAP_THRESHOLD" --fail-above
          --format json > crap.json

      - name: summarize the gate result
        if: always()
        run: |
          # Shell-only: no python3 on fleet runners, and this step must not
          # be able to fail a build — a reporting crash once reddened a whole
          # PR over a passed coverage gate.
          set -uo pipefail
          {
            echo "### Coverage + CRAP gate"
            if [ -f lcov.info ]; then
              awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END {if (lf>0) printf "Line coverage: %.2f%% (%d/%d lines)\n", 100*lh/lf, lh, lf; else print "Line coverage: no LCOV data"}' lcov.info
            else
              echo "coverage step did not produce lcov.info (compile/test failure earlier)"
            fi
            if [ -f crap.json ]; then
              vals=$(tr -d ' \n' < crap.json | grep -o '"crap":[0-9.]*' | cut -d: -f2)
              if [ -n "$vals" ]; then
                n=$(printf '%s\n' "$vals" | grep -c .)
                worst=$(printf '%s\n' "$vals" | sort -g | tail -1)
                echo "CRAP functions scored: $n; worst: $worst; threshold $CRAP_THRESHOLD"
              else
                echo "crap.json present but unparsable"
              fi
            else
              echo "CRAP step did not complete"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
