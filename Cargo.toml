[package]
name = "dlaunch"
version = "0.1.0"
edition = "2021"
description = "Persistent Claude CLI session manager — per-project sessions with optional tmux"
license = "MIT"
repository = "https://github.com/dirmacs/dlaunch"
keywords = ["cli", "claude", "tmux", "session", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "dlaunch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
